name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust launcher (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: launcher
