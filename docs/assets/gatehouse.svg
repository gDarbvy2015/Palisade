<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" role="img"
     aria-labelledby="ghTitle ghDesc" font-family="'Iosevka','JetBrains Mono',ui-monospace,monospace">
  <title id="ghTitle">Palisade gatehouse: the five checks before a command is admitted</title>
  <desc id="ghDesc">A stone gatehouse with a copper portcullis. A command approaches from the
  left and must clear five wardens (program, args, env, path, time) before the portcullis
  rises and admits it. This depicts userspace policy validation, not kernel isolation.</desc>

  <defs>
    <linearGradient id="parchment" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4ecd8"/>
      <stop offset="1" stop-color="#e6d8b8"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f5a73"/>
      <stop offset="1" stop-color="#26384a"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d98a4e"/>
      <stop offset="1" stop-color="#9c5a2c"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#1a2733" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="880" height="400" fill="url(#parchment)"/>
