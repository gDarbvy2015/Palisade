<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" role="img"
     aria-labelledby="ghTitle ghDesc" font-family="'Iosevka','JetBrains Mono',ui-monospace,monospace">
  <title id="ghTitle">Palisade gatehouse: the five checks before a command is admitted</title>
  <desc id="ghDesc">A stone gatehouse with a copper portcullis. A command approaches from the
  left and must clear five wardens (program, args, env, path, time) before the portcullis
  rises and admits it. This depicts userspace policy validation, not kernel isolation.</desc>

  <defs>
    <linearGradient id="parchment" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4ecd8"/>
      <stop offset="1" stop-color="#e6d8b8"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f5a73"/>
      <stop offset="1" stop-color="#26384a"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d98a4e"/>
      <stop offset="1" stop-color="#9c5a2c"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#1a2733" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="880" height="400" fill="url(#parchment)"/>
  <!-- faint drafting grid -->
  <g stroke="#c9bd9c" stroke-width="1" opacity="0.4">
    <path d="M0 40 H880 M0 80 H880 M0 120 H880 M0 160 H880 M0 200 H880 M0 240 H880 M0 280 H880 M0 320 H880 M0 360 H880"/>
    <path d="M40 0 V400 M120 0 V400 M200 0 V400 M280 0 V400 M360 0 V400 M440 0 V400 M520 0 V400 M600 0 V400 M680 0 V400 M760 0 V400 M840 0 V400"/>
  </g>

  <!-- title cartouche -->
  <rect x="24" y="18" width="360" height="30" rx="4" fill="url(#steel)" filter="url(#soft)"/>
  <text x="40" y="38" fill="#f4ecd8" font-size="15" letter-spacing="2">PALISADE · GATEHOUSE</text>
  <text x="856" y="38" text-anchor="end" fill="#7a5a34" font-size="12">userspace launcher, not a kernel sandbox</text>

  <!-- the fortress wall + gatehouse on the right -->
  <g filter="url(#soft)">
    <rect x="600" y="70" width="256" height="300" fill="url(#steel)"/>
    <!-- crenellations -->
    <g fill="#26384a">
      <rect x="600" y="58" width="26" height="18"/><rect x="652" y="58" width="26" height="18"/>
      <rect x="704" y="58" width="26" height="18"/><rect x="756" y="58" width="26" height="18"/>
      <rect x="808" y="58" width="26" height="18"/>
    </g>
    <!-- stone courses -->
    <g stroke="#1c2b3a" stroke-width="1" opacity="0.5">
      <path d="M600 110 H856 M600 150 H856 M600 190 H856 M600 230 H856 M600 270 H856 M600 310 H856 M600 350 H856"/>
      <path d="M640 70 V110 M700 110 V150 M660 150 V190 M720 190 V230 M660 230 V270"/>
    </g>
    <!-- gate arch -->
    <path d="M636 370 V210 a52 52 0 0 1 104 0 V370 Z" fill="#141f2a"/>
  </g>

  <!-- portcullis (copper) that rises when all checks pass -->
  <g filter="url(#soft)">
    <g id="portcullis">
      <rect x="638" y="160" width="100" height="210" fill="url(#copper)" opacity="0.28"/>
      <g stroke="url(#copper)" stroke-width="6">
        <path d="M652 160 V370 M672 160 V370 M692 160 V370 M712 160 V370 M732 160 V370"/>
        <path d="M638 196 H738 M638 244 H738 M638 292 H738 M638 340 H738"/>
      </g>
      <!-- spikes -->
      <g fill="url(#copper)">
        <path d="M646 370 l6 12 6 -12 Z"/><path d="M666 370 l6 12 6 -12 Z"/>
        <path d="M686 370 l6 12 6 -12 Z"/><path d="M706 370 l6 12 6 -12 Z"/>
        <path d="M726 370 l6 12 6 -12 Z"/>
      </g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 0; 0 -150; 0 -150; 0 0"
        keyTimes="0; 0.62; 0.78; 0.92; 1" dur="9s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- the approaching command token -->
  <g filter="url(#soft)">
    <g id="token">
      <rect x="0" y="212" width="150" height="34" rx="6" fill="#1f2d3a"/>
      <text x="12" y="234" fill="#8fd6a3" font-size="13">$ palisade run</text>
      <animateTransform attributeName="transform" type="translate"
        values="30 0; 30 0; 470 0; 470 0; 620 0; 620 0; 30 0"
        keyTimes="0; 0.06; 0.62; 0.72; 0.86; 0.95; 1" dur="9s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- five wardens: each lights green in turn -->
  <g font-size="12" text-anchor="middle">
    <g transform="translate(210,300)">
      <circle r="20" fill="#2a3d4f" stroke="url(#copper)" stroke-width="2"/>
      <text y="4" fill="#f4ecd8">prog</text>
      <circle r="6" cx="0" cy="-30" fill="#8fd6a3" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.14;0.2;1" dur="9s" repeatCount="indefinite"/>
      </circle>
      <text y="44" fill="#3f5a73">exec.program</text>
    </g>
    <g transform="translate(300,300)">
      <circle r="20" fill="#2a3d4f" stroke="url(#copper)" stroke-width="2"/>
      <text y="4" fill="#f4ecd8">args</text>
      <circle r="6" cx="0" cy="-30" fill="#8fd6a3" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.24;0.3;1" dur="9s" repeatCount="indefinite"/>
      </circle>
      <text y="44" fill="#3f5a73">allow-list</text>
    </g>
    <g transform="translate(390,300)">
      <circle r="20" fill="#2a3d4f" stroke="url(#copper)" stroke-width="2"/>
      <text y="4" fill="#f4ecd8">env</text>
      <circle r="6" cx="0" cy="-30" fill="#8fd6a3" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.34;0.4;1" dur="9s" repeatCount="indefinite"/>
      </circle>
      <text y="44" fill="#3f5a73">clean / inherit</text>
    </g>
    <g transform="translate(480,300)">
      <circle r="20" fill="#2a3d4f" stroke="url(#copper)" stroke-width="2"/>
      <text y="4" fill="#f4ecd8">path</text>
      <circle r="6" cx="0" cy="-30" fill="#8fd6a3" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.44;0.5;1" dur="9s" repeatCount="indefinite"/>
      </circle>
      <text y="44" fill="#3f5a73">under root?</text>
    </g>
    <g transform="translate(570,300)">
      <circle r="20" fill="#2a3d4f" stroke="url(#copper)" stroke-width="2"/>
      <text y="4" fill="#f4ecd8">time</text>
      <circle r="6" cx="0" cy="-30" fill="#8fd6a3" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.54;0.6;1" dur="9s" repeatCount="indefinite"/>
      </circle>
