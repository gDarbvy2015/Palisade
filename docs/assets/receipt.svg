<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" role="img"
     aria-labelledby="rcTitle rcDesc" font-family="'Iosevka','JetBrains Mono',ui-monospace,monospace">
  <title id="rcTitle">The receipt: a machine-readable record of what was actually run</title>
  <desc id="rcDesc">A parchment terminal on which palisade inscribes a JSON receipt line by line
  (policy name, resolved path, arguments, environment mode, effective env key names, declared
  network mode, timeout, duration, and outcome), then presses a wax seal. Env values are never
  recorded; only key names.</desc>

  <defs>
    <linearGradient id="rcParch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6efdc"/>
      <stop offset="1" stop-color="#e8dabb"/>
    </linearGradient>
    <linearGradient id="rcSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f5a73"/>
      <stop offset="1" stop-color="#22323f"/>
    </linearGradient>
    <radialGradient id="wax" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#c86a3a"/>
      <stop offset="1" stop-color="#7d3a1c"/>
    </radialGradient>
    <filter id="rcSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#1a2733" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="880" height="420" fill="url(#rcParch)"/>

  <!-- header rail -->
  <rect x="0" y="0" width="880" height="46" fill="url(#rcSteel)"/>
  <circle cx="26" cy="23" r="7" fill="#d98a4e"/><circle cx="48" cy="23" r="7" fill="#e6d8b8"/><circle cx="70" cy="23" r="7" fill="#8fd6a3"/>
  <text x="100" y="28" fill="#f4ecd8" font-size="14" letter-spacing="1">palisade run --policy git-status.policy --receipt receipt.json</text>

  <!-- terminal body -->
  <rect x="28" y="70" width="560" height="322" rx="8" fill="#16222e" filter="url(#rcSoft)"/>
  <g font-size="13.5">
    <text x="48" y="100" fill="#8fd6a3">$ palisade run --policy examples/git-status.policy \</text>
    <text x="66" y="120" fill="#8fd6a3">--receipt receipt.json</text>
    <text x="48" y="146" fill="#7a97ad">wrote receipt.json</text>

    <!-- JSON receipt, revealed key by key -->
    <g fill="#e8dabb">
      <text x="48"  y="176" opacity="0"><tspan fill="#d98a4e">{</tspan>
        <animate attributeName="opacity" values="0;1" begin="0.2s" dur="0.3s" fill="freeze"/></text>
      <text x="66"  y="196" opacity="0">"policy_name": <tspan fill="#8fd6a3">"git-status"</tspan>,
        <animate attributeName="opacity" values="0;1" begin="0.6s" dur="0.3s" fill="freeze"/></text>
      <text x="66"  y="216" opacity="0">"resolved_path": <tspan fill="#8fd6a3">"/usr/bin/git"</tspan>,
        <animate attributeName="opacity" values="0;1" begin="1.0s" dur="0.3s" fill="freeze"/></text>
      <text x="66"  y="236" opacity="0">"args": <tspan fill="#c8dcea">["status","--short"]</tspan>,
        <animate attributeName="opacity" values="0;1" begin="1.4s" dur="0.3s" fill="freeze"/></text>
      <text x="66"  y="256" opacity="0">"env_mode": <tspan fill="#8fd6a3">"inherit"</tspan>,
        <animate attributeName="opacity" values="0;1" begin="1.8s" dur="0.3s" fill="freeze"/></text>
      <text x="66"  y="276" opacity="0">"effective_env_keys": <tspan fill="#c8dcea">["HOME","PATH",…]</tspan>,
        <animate attributeName="opacity" values="0;1" begin="2.2s" dur="0.3s" fill="freeze"/></text>
      <text x="66"  y="296" opacity="0">"net_declared": <tspan fill="#d9b04e">"none"</tspan>,
        <animate attributeName="opacity" values="0;1" begin="2.6s" dur="0.3s" fill="freeze"/></text>
      <text x="66"  y="316" opacity="0">"timeout_ms": <tspan fill="#c8dcea">10000</tspan>, "duration_ms": <tspan fill="#c8dcea">42</tspan>,
        <animate attributeName="opacity" values="0;1" begin="3.0s" dur="0.3s" fill="freeze"/></text>
      <text x="66"  y="336" opacity="0">"outcome": <tspan fill="#8fd6a3">"exited"</tspan>, "exit_code": <tspan fill="#8fd6a3">0</tspan>
        <animate attributeName="opacity" values="0;1" begin="3.4s" dur="0.3s" fill="freeze"/></text>
      <text x="48"  y="356" opacity="0"><tspan fill="#d98a4e">}</tspan>
        <animate attributeName="opacity" values="0;1" begin="3.8s" dur="0.3s" fill="freeze"/></text>
    </g>
    <!-- blinking cursor -->
    <rect x="48" y="368" width="9" height="15" fill="#8fd6a3">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- side tapestry: what a receipt is (and is not) -->
  <g transform="translate(620,70)">
    <rect x="0" y="0" width="232" height="322" rx="8" fill="url(#rcSteel)" filter="url(#rcSoft)"/>
    <text x="18" y="30" fill="#f4ecd8" font-size="14" letter-spacing="1">SEAL OF RECORD</text>
    <line x1="18" y1="42" x2="214" y2="42" stroke="#d98a4e" stroke-width="1.5"/>

    <g font-size="11.5" fill="#c8dcea">
      <text x="18" y="66">records key <tspan fill="#8fd6a3">names</tspan>, never</text>
      <text x="18" y="82">env <tspan fill="#e6b6b0">values</tspan></text>
      <text x="18" y="106">net_declared is a</text>
      <text x="18" y="122"><tspan fill="#d9b04e">declaration</tspan>, not a block</text>
      <text x="18" y="146">deterministic: env keys</text>
      <text x="18" y="162">sorted before write</text>
      <text x="18" y="186">outcome ∈ {exited,</text>
      <text x="18" y="202">timed_out}</text>
    </g>

    <!-- wax seal being pressed -->
    <g transform="translate(116,262)">
      <circle r="0" fill="url(#wax)">
        <animate attributeName="r" values="0;0;40;40" keyTimes="0;0.45;0.55;1" dur="8s" repeatCount="indefinite"/>
      </circle>
      <g opacity="0" stroke="#f4d9c2" stroke-width="2" fill="none">
        <path d="M-16 -6 h32 M-16 4 h32 M-10 -14 v28 M10 -14 v28"/>
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.55;0.62;1" dur="8s" repeatCount="indefinite"/>
      </g>
      <text y="52" text-anchor="middle" fill="#e6d8b8" font-size="11" opacity="0">audit-ready
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6;0.7;1" dur="8s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>
</svg>
