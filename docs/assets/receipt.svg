<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" role="img"
     aria-labelledby="rcTitle rcDesc" font-family="'Iosevka','JetBrains Mono',ui-monospace,monospace">
  <title id="rcTitle">The receipt: a machine-readable record of what was actually run</title>
  <desc id="rcDesc">A parchment terminal on which palisade inscribes a JSON receipt line by line
  (policy name, resolved path, arguments, environment mode, effective env key names, declared
  network mode, timeout, duration, and outcome), then presses a wax seal. Env values are never
  recorded; only key names.</desc>

  <defs>
    <linearGradient id="rcParch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6efdc"/>
      <stop offset="1" stop-color="#e8dabb"/>
    </linearGradient>
    <linearGradient id="rcSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f5a73"/>
      <stop offset="1" stop-color="#22323f"/>
    </linearGradient>
    <radialGradient id="wax" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#c86a3a"/>
      <stop offset="1" stop-color="#7d3a1c"/>
    </radialGradient>
    <filter id="rcSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#1a2733" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="880" height="420" fill="url(#rcParch)"/>

  <!-- header rail -->
  <rect x="0" y="0" width="880" height="46" fill="url(#rcSteel)"/>
  <circle cx="26" cy="23" r="7" fill="#d98a4e"/><circle cx="48" cy="23" r="7" fill="#e6d8b8"/><circle cx="70" cy="23" r="7" fill="#8fd6a3"/>
  <text x="100" y="28" fill="#f4ecd8" font-size="14" letter-spacing="1">palisade run --policy git-status.policy --receipt receipt.json</text>

